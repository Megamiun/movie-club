name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required to assume the AWS role via OIDC (no stored AWS keys, see infra/github_oidc.tf)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: ktlint
        run: ./gradlew :backend:ktlintCheck
      - name: Test
        run: ./gradlew :backend:test
      # Built once here (native amd64, already has a warm Gradle cache from ktlint/test above) and handed to
      # `deploy` as an artifact -- deploy's own Docker build then never needs Gradle/Java at all, just a file
      # copy, which needs no QEMU emulation even when targeting arm64 (see the Dockerfile and deploy job below).
      - name: Build install distribution
        run: ./gradlew :backend:installDist
      - uses: actions/upload-artifact@v7
        with:
          name: backend-install
          path: backend/build/install/backend
          retention-days: 1

  deploy:
    needs: test
    # Never on a PR -- the OIDC trust policy only allows assuming the role from a push to main anyway (see
    # infra/github_oidc.tf), so a PR run would just fail at the credentials step; skip it outright instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Gated behind the "production" GitHub Environment's required reviewers (configured in repo Settings ->
    # Environments, not in this file) -- same manual-approval pattern already used by terraform.yml's apply job,
    # so a push to main runs test/build automatically but a human has to approve before anything actually deploys.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: backend-install
          path: backend/build/install/backend

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # The EC2 instance is arm64 (Graviton, see infra/variables.tf's instance_type) but this runner is amd64.
      # No QEMU needed despite that, unlike a typical cross-arch build: `target: from-artifact` (below) points at
      # the Dockerfile stage with no RUN instructions at all (the actual Gradle build already happened natively
      # above, in `test`) -- it only copies prebuilt, architecture-independent files into an arm64 base image,
      # which buildx can do without emulating any target-architecture code execution. The Dockerfile's *default*
      # target (used by docker-compose.yml/local dev) still builds from source inside the container as before.
      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: from-artifact
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/movie-club-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/movie-club-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Resolved by tag (infra/ec2.tf's Name tag), not a stored EC2_INSTANCE_ID repo variable -- that id changes
      # whenever the instance is ever replaced (a subnet/instance-type/AMI change, etc.), which would silently
      # leave a stale value behind. Nothing to keep in sync this way.
      - name: Resolve EC2 instance id
        id: instance
        run: |
          echo "id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=movie-club-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)" >> "$GITHUB_OUTPUT"

      # Not SSH: a GitHub-hosted runner's IP is dynamic per run, so it could never satisfy the security group's
      # ssh_allowed_cidr (that's deliberately scoped to the operator's own fixed IP, admin access only). SSM Run
      # Command authenticates through the same OIDC-assumed role instead -- no inbound port needed at all.
      # Commands run as root under SSM, so no `sudo` needed (unlike an SSH login as ec2-user would).
      - name: Deploy to EC2 via SSM Run Command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/movie-club-backend:${{ github.sha }}
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<SCRIPT_EOF
          set -euo pipefail
          cd /opt/movie-club
          ./fetch-secrets.sh
          echo "BACKEND_IMAGE=$IMAGE" | tee -a .env > /dev/null
          docker compose pull
          docker compose up -d
          docker image prune -f
          SCRIPT_EOF
          )

          PARAMS_JSON=$(jq -n --arg script "$SCRIPT" '{commands: ($script | split("\n"))}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" --output text

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          [ "$STATUS" = "Success" ]
