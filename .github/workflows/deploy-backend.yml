name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required to assume the AWS role via OIDC (no stored AWS keys, see infra/github_oidc.tf)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: ktlint
        run: ./gradlew :backend:ktlintCheck
      - name: Test
        run: ./gradlew :backend:test

  deploy:
    needs: test
    # Never on a PR -- the OIDC trust policy only allows assuming the role from a push to main anyway (see
    # infra/github_oidc.tf), so a PR run would just fail at the credentials step; skip it outright instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Gated behind the "production" GitHub Environment's required reviewers (configured in repo Settings ->
    # Environments, not in this file) -- same manual-approval pattern already used by terraform.yml's apply job,
    # so a push to main runs test/build automatically but a human has to approve before anything actually deploys.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # The EC2 instance is arm64 (Graviton, see infra/variables.tf's instance_type) but this runner is amd64 --
      # QEMU emulation lets buildx cross-compile the image for the box it'll actually run on.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/movie-club-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/movie-club-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Not SSH: a GitHub-hosted runner's IP is dynamic per run, so it could never satisfy the security group's
      # ssh_allowed_cidr (that's deliberately scoped to the operator's own fixed IP, admin access only). SSM Run
      # Command authenticates through the same OIDC-assumed role instead -- no inbound port needed at all.
      # Commands run as root under SSM, so no `sudo` needed (unlike an SSH login as ec2-user would).
      - name: Deploy to EC2 via SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/movie-club-backend:${{ github.sha }}
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<SCRIPT_EOF
          set -euo pipefail
          cd /opt/movie-club
          ./fetch-secrets.sh
          echo "BACKEND_IMAGE=$IMAGE" | tee -a .env > /dev/null
          docker compose pull
          docker compose up -d
          docker image prune -f
          SCRIPT_EOF
          )

          PARAMS_JSON=$(jq -n --arg script "$SCRIPT" '{commands: ($script | split("\n"))}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" --output text

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          [ "$STATUS" = "Success" ]
