name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required to assume the AWS role via OIDC (no stored AWS keys, see infra/github_oidc.tf)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint

  deploy:
    needs: test
    # Never on a PR -- the OIDC trust policy only allows assuming the role from a push to main anyway (see
    # infra/github_oidc.tf), so a PR run would just fail at the credentials step; skip it outright instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Gated behind the "production" GitHub Environment's required reviewers (configured in repo Settings ->
    # Environments, not in this file) -- same manual-approval pattern already used by terraform.yml's apply job,
    # so a push to main runs test/build automatically but a human has to approve before anything actually deploys.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Baked into the static build at build time (Vite env vars aren't a runtime config) -- must match
          # infra's api_subdomain + domain_name.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Derived from PROJECT_NAME rather than a stored S3_FRONTEND_BUCKET variable -- infra/s3_frontend.tf names
      # the bucket "${var.project_name}-frontend" itself, so there's nothing to keep in sync here; a stored copy
      # is exactly what went stale the first time project_name changed (see infra/README.md's Backups section).
      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ vars.PROJECT_NAME }}-frontend" --delete

      # Resolved by alias (infra/cloudfront.tf's own `aliases = [local.frontend_domain]`), not a stored
      # CLOUDFRONT_DISTRIBUTION_ID repo variable -- that id is provider-assigned (unlike the bucket name above, it
      # can't be derived from any input variable) and would go stale the moment the distribution is ever replaced,
      # same reasoning as deploy-backend.yml's own EC2 instance id resolution by tag.
      - name: Resolve CloudFront distribution id
        id: distribution
        run: |
          echo "id=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '${{ vars.DOMAIN_NAME }}')].Id | [0]" \
            --output text)" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.distribution.outputs.id }}" \
            --paths "/*"
