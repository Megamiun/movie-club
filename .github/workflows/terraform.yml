name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {}

jobs:
  # Syntax/formatting/internal-reference checks only, no AWS credentials -- runs automatically on every push and
  # PR (including from forks), plus manual dispatch. No `if:` needed -- it runs on whichever of this workflow's
  # three `on:` triggers actually fired. The plan/apply jobs below deliberately do NOT trust pull_request at all
  # (see infra/github_oidc_terraform.tf's trust policy comment): this repo is public, and a pull_request-trusted
  # OIDC role is a known risk (the workflow file for that event is sourced from the PR's own branch). This job is
  # the free automatic feedback that doesn't require extending that trust -- actually touching real infra (plan/
  # apply, below) stays manual-only.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -diff
      - name: Terraform init (no backend)
        working-directory: infra
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infra
        run: terraform validate

  # Real plan (needs AWS credentials + backend state) -- runs automatically on a push to main (or a manual
  # dispatch against main), no approval gate: `terraform plan` is read-only (this repo's own .tf files have no
  # local-exec/external-data-source escape hatch that would make it otherwise), so gating it added friction
  # without a matching safety benefit -- the actual checkpoint is `apply` below, which still requires a human to
  # explicitly approve before anything real changes.
  #
  # This was ungated once already, then briefly re-gated after it broke this job outright: every repo Variable
  # this workflow reads (AWS_TERRAFORM_ROLE_ARN, TF_STATE_BUCKET, etc.) was configured at the "production" GitHub
  # Environment level at the time, not the repository level -- GitHub only exposes environment-scoped variables
  # to a job that actually declares that environment, so `vars.AWS_TERRAFORM_ROLE_ARN` resolved to empty the
  # moment this job stopped declaring one, and `configure-aws-credentials` failed with "Could not load
  # credentials from any providers." Fixed at the source instead of by re-gating: every variable read anywhere in
  # this workflow (and deploy-frontend.yml/deploy-backend.yml's) is now repository-level, not environment-scoped
  # -- none of them are actual secrets (just ARNs/ids/names; the real secrets go through SSM, never GitHub at
  # all), so there was no security reason for them to live inside "production"'s protection rules in the first
  # place. That Environment now exists purely for its required-reviewer gate on `apply` below (and on
  # deploy-frontend.yml/deploy-backend.yml's own `deploy` jobs), not as a variable store. workflow_dispatch can
  # technically target any branch, hence the ref check -- without it, dispatching from a feature branch would
  # still queue a plan against real infra off that branch's state. Uploads the plan file as a build artifact so
  # `apply` (below) applies exactly what was planned here, rather than re-planning and risking drift between the
  # two.
  plan:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to assume the AWS role via OIDC (no stored AWS keys)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidr: ${{ vars.SSH_ALLOWED_CIDR }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_tf_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          # Public, non-sensitive, and immutable by design (see variables.tf's comment) -- hardcoded rather than
          # yet another repo Variable to set up. Find these again via `gh api users/<owner> --jq .id` / `gh api
          # repos/<owner>/<repo> --jq .id` if this repo is ever forked/renamed to a new owner.
          TF_VAR_github_owner_id: "7376453"
          TF_VAR_github_repo_id: "1325939621"
        run: terraform plan -input=false -out=tfplan

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  # The one approval gate in this workflow -- plan (above) runs unattended (it's read-only), so this is where a
  # human actually has to sign off before anything real changes. Reviewer reads plan's own job log/output
  # (already finished by the time this pauses) via the "production" GitHub Environment's required-reviewer
  # approval (Settings -> Environments, not in this file) before `terraform apply` runs.
  apply:
    needs: plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # required to assume the AWS role via OIDC (no stored AWS keys)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: infra

      # Applies the exact plan artifact from the `plan` job -- no re-planning, no TF_VAR_* needed again (they're
      # already baked into the saved plan).
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false tfplan

      # Reconciles the *already-running* instance's own /opt/movie-club/docker-compose.yml with whatever this
      # apply just changed -- ec2.tf's aws_instance.app deliberately ignores user_data changes (see its own
      # comment: user_data only ever runs once, at first boot, and AWS requires stopping the instance to even
      # attempt applying an updated one in place), so a template edit alone would otherwise never reach a live
      # instance without actually replacing it. docker_compose_content (outputs.tf) is the exact same rendered
      # content a fresh instance's own first boot would write (see main.tf's local.docker_compose_content) --
      # pushing it here keeps the two paths from ever drifting apart, for this change and any future one.
      #
      # Reads via the still-active Terraform role (state lives in the S3 backend, which only that role -- not
      # the deploy role below -- has access to) and writes the content to a plain file, since the next step
      # switches credentials away from it.
      - name: Read rendered config from Terraform state
        working-directory: infra
        run: |
          terraform output -raw docker_compose_content > /tmp/docker-compose.yml
          terraform output -raw caddyfile_content > /tmp/Caddyfile
          terraform output -raw prometheus_config_content > /tmp/prometheus.yml
          terraform output -raw grafana_datasources_content > /tmp/grafana-datasources.yml

      # Deliberately the *deploy* role here, not the Terraform role active above -- SSM Run Command is a much
      # more powerful, different-shaped permission (arbitrary shell execution on the production instance) than
      # anything else this job's own role is scoped for, and deploy-backend.yml's role is already narrowly
      # scoped for exactly this (ssm:SendCommand/GetCommandInvocation against just this one instance, see
      # github_oidc.tf) -- reusing it here keeps that boundary intact instead of widening the Terraform role's
      # own permissions to cover it too.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Same SSM Run Command approach as deploy-backend.yml's own deploy step, and the same reason: a GitHub-
      # hosted runner's IP is too dynamic for the instance's SSH-only security group rule.
      - name: Resolve EC2 instance id
        id: instance
        run: |
          echo "id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=movie-club-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)" >> "$GITHUB_OUTPUT"

      - name: Sync live config to the instance
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail
          COMPOSE_CONTENT=$(cat /tmp/docker-compose.yml)
          CADDYFILE_CONTENT=$(cat /tmp/Caddyfile)
          PROMETHEUS_CONTENT=$(cat /tmp/prometheus.yml)
          GRAFANA_DATASOURCES_CONTENT=$(cat /tmp/grafana-datasources.yml)

          SCRIPT=$(cat <<SCRIPT_EOF
          set -euo pipefail
          cat > /opt/movie-club/docker-compose.yml <<'COMPOSE_EOF'
          $COMPOSE_CONTENT
          COMPOSE_EOF
          cat > /etc/caddy/Caddyfile <<'CADDY_EOF'
          $CADDYFILE_CONTENT
          CADDY_EOF
          cat > /opt/movie-club/prometheus.yml <<'PROMETHEUS_EOF'
          $PROMETHEUS_CONTENT
          PROMETHEUS_EOF
          cat > /opt/movie-club/grafana-datasources.yml <<'GRAFANA_EOF'
          $GRAFANA_DATASOURCES_CONTENT
          GRAFANA_EOF
          systemctl reload caddy
          cd /opt/movie-club
          # No pull/no image change here (that's deploy-backend.yml's own job) -- this only picks up config
          # (env vars, logging options, bind-mounted config files, etc.) that changed, restarting whichever
          # service's config actually changed. A no-op apply (nothing in any of the above changed) still runs
          # this harmlessly.
          docker compose up -d
          # up -d alone only restarts a container whose *compose service definition* changed -- prometheus.yml/
          # grafana-datasources.yml are bind-mounted files whose *content* can change without the compose file
          # itself changing, so these two need an explicit restart to actually pick that up.
          docker compose restart prometheus grafana
          SCRIPT_EOF
          )

          PARAMS_JSON=$(jq -n --arg script "$SCRIPT" '{commands: ($script | split("\n"))}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" --output text

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          [ "$STATUS" = "Success" ]
