name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {}

jobs:
  # Syntax/formatting/internal-reference checks only, no AWS credentials -- runs automatically on every push and
  # PR (including from forks), plus manual dispatch. No `if:` needed -- it runs on whichever of this workflow's
  # three `on:` triggers actually fired. The plan/apply jobs below deliberately do NOT trust pull_request at all
  # (see infra/github_oidc_terraform.tf's trust policy comment): this repo is public, and a pull_request-trusted
  # OIDC role is a known risk (the workflow file for that event is sourced from the PR's own branch). This job is
  # the free automatic feedback that doesn't require extending that trust -- actually touching real infra (plan/
  # apply, below) stays manual-only.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -diff
      - name: Terraform init (no backend)
        working-directory: infra
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infra
        run: terraform validate

  # Real plan (needs AWS credentials + backend state) -- manual dispatch only, deliberately not triggered by a
  # push to main. validate (above) already gives automatic fast feedback on every push/PR; actually touching real
  # infra state requires someone to click "Run workflow". workflow_dispatch can technically target any branch,
  # hence the ref check -- without it, dispatching from a feature branch would still try to plan/apply real infra
  # off that branch's state. Uploads the plan file as a build artifact so `apply` (below) applies exactly what
  # was planned here, rather than re-planning and risking drift between the two.
  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to assume the AWS role via OIDC (no stored AWS keys)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidr: ${{ vars.SSH_ALLOWED_CIDR }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_tf_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
        run: terraform plan -input=false -out=tfplan

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  # Gated behind the "production" GitHub Environment's required reviewers (configured in repo Settings →
  # Environments, not in this file) -- the job pauses here until a human approves, so a bad plan gets a checkpoint
  # before it touches real infrastructure. The reviewer can read `plan`'s own job log (already finished by the
  # time this pauses) before approving.
  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # required to assume the AWS role via OIDC (no stored AWS keys)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: infra

      # Applies the exact plan artifact from the `plan` job -- no re-planning, no TF_VAR_* needed again (they're
      # already baked into the saved plan).
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false tfplan
