ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ br.com.gabryel.movieclub.ApplicationKt.module ]
    }
}

database {
    url = ${?DATABASE_URL}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
}

jwt {
    secret = ${?JWT_SECRET}
    issuer = "movie-club"
    audience = "movie-club-users"
}

google {
    clientId = ${?GOOGLE_CLIENT_ID}
    clientSecret = ${?GOOGLE_CLIENT_SECRET}
}

tmdb {
    apiKey = ${?TMDB_API_KEY}
}

aws {
    accessKeyId = ${?AWS_ACCESS_KEY_ID}
    secretAccessKey = ${?AWS_SECRET_ACCESS_KEY}
    region = ${?AWS_REGION}
    bucketName = ${?S3_BUCKET_NAME}
}